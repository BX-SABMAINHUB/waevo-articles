<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waevo Articles - Centro de Soporte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --danger: #dc2626;
            --danger-light: #fecaca;
            --success: #16a34a;
            --warning: #d97706;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo i { font-size: 1.8rem; }
        .search-bar {
            flex: 1;
            max-width: 400px;
            margin: 0 2rem;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            font-size: 0.95rem;
            background: var(--bg);
            transition: all 0.2s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .search-bar i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
        }
        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .hero p { color: var(--text-secondary); font-size: 1.1rem; }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }
        .article-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .article-card h2 { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--text); }
        .article-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-bottom: 0.75rem;
        }
        .article-meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 1rem; }

        .article-full {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
        }
        .article-full img { max-width: 100%; border-radius: var(--radius-sm); margin: 1rem 0; }
        .article-full h1 { font-size: 2rem; margin-bottom: 1rem; }
        .article-full .desc { color: var(--text-secondary); font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        .admin-trigger {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.25;
            transition: all 0.3s;
            z-index: 200;
        }
        .admin-trigger:hover { opacity: 1; color: var(--primary); border-color: var(--primary); }
        .tt-trigger { bottom: 5rem; font-size: 0.85rem; font-weight: 700; }

        .ticket-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 2rem auto;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }
        .ticket-btn:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }

        .my-tickets-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 1rem auto;
            padding: 0.8rem 2rem;
            background: var(--surface);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .my-tickets-btn:hover { background: var(--primary-light); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal h3 { margin-bottom: 1rem; font-size: 1.3rem; }
        .modal input, .modal textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            font-family: inherit;
        }
        .modal textarea { min-height: 100px; resize: vertical; }
        .modal button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        .modal button.secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-bottom: 0.5rem; }

        .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }

        .chat-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: var(--shadow);
        }
        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .chat-msg {
            max-width: 75%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .chat-msg.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 0; }
        .chat-msg.admin { align-self: flex-start; background: #f1f5f9; border-bottom-left-radius: 0; }
        .chat-msg img { max-width: 200px; border-radius: 8px; margin-top: 0.5rem; }
        .chat-msg .link-bar {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            margin-top: 0.4rem;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .chat-sender { font-weight: 700; font-size: 0.8rem; margin-bottom: 0.2rem; }
        .chat-input-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .chat-input-row input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            font-size: 0.95rem;
        }
        .chat-input-row button {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
        }
        .chat-input-row button.link-btn {
            background: var(--warning);
        }

        .ticket-list-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .ticket-list-item:hover { box-shadow: var(--shadow-md); }
        .ticket-list-item .info { flex: 1; }
        .ticket-list-item .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-open { background: #dbeafe; color: #1e40af; }
        .status-closed { background: #f1f5f9; color: #64748b; }
        .close-ticket-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 0.5rem;
        }
        .ban-user-btn {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 0.5rem;
        }
        .closed-notice {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .user-id-badge {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            box-shadow: var(--shadow);
            z-index: 50;
        }
        .image-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: var(--radius-sm);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-content">
        <a href="/" class="logo">
            <i class="fas fa-book-open"></i> Waevo Articles
        </a>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar artículos..." oninput="filterArticles()">
        </div>
    </div>
</header>

<main class="main" id="main-content">
    <!-- Contenido dinámico -->
</main>

<!-- ID de usuario -->
<div class="user-id-badge" id="user-id-badge">ID: ---</div>

<!-- Botones flotantes -->
<div class="admin-trigger" id="adminTrigger" title="Crear artículo">+</div>
<div class="admin-trigger tt-trigger" id="ttTrigger" title="Tickets admin">tt</div>

<!-- Modal de contraseña para artículos -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal">
        <h3>Acceso de administrador</h3>
        <input type="password" id="adminPassword" placeholder="Contraseña">
        <div class="error-msg" id="passwordError"></div>
        <button onclick="checkAdminPassword()">Acceder</button>
        <button class="secondary" onclick="closePasswordModal()">Cancelar</button>
    </div>
</div>

<!-- Modal de creación de artículo -->
<div class="modal-overlay" id="articleModal">
    <div class="modal">
        <h3>Crear nuevo artículo</h3>
        <input type="text" id="articleTitle" placeholder="Título del artículo">
        <textarea id="articleDesc" placeholder="Descripción / Contenido"></textarea>
        <input type="url" id="articleImage" placeholder="URL de la imagen (opcional)">
        <div class="error-msg" id="articleError"></div>
        <button onclick="createArticle()">Publicar artículo</button>
        <button class="secondary" onclick="closeArticleModal()">Cancelar</button>
    </div>
</div>

<!-- Modal de contraseña para tickets admin -->
<div class="modal-overlay" id="ttPasswordModal">
    <div class="modal">
        <h3>Acceso a tickets</h3>
        <input type="password" id="ttPassword" placeholder="Contraseña">
        <div class="error-msg" id="ttPasswordError"></div>
        <button onclick="checkTTPassword()">Acceder</button>
        <button class="secondary" onclick="closeTTPasswordModal()">Cancelar</button>
    </div>
</div>

<!-- Modal de confirmación antes de crear ticket -->
<div class="modal-overlay" id="confirmTicketModal">
    <div class="modal">
        <h3 id="confirmStepTitle">Confirmación de uso responsable</h3>
        <p id="confirmStepText">¿Estás seguro de que necesitas crear un ticket de soporte?</p>
        <div class="error-msg" id="confirmError"></div>
        <button onclick="nextConfirmStep()">Sí, continuar</button>
        <button class="secondary" onclick="closeConfirmModal()">Cancelar</button>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD13N4-9MjTrmlPwGP7mves0Exje4v2ACw",
        authDomain: "kahoot-8529e.firebaseapp.com",
        databaseURL: "https://kahoot-8529e-default-rtdb.firebaseio.com",
        projectId: "kahoot-8529e",
        storageBucket: "kahoot-8529e.firebasestorage.app",
        messagingSenderId: "313414356056",
        appId: "1:313414356056:web:4aab4587f7df9393008e2d",
        measurementId: "G-8T4CPC1BQ3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbPush = push;
    window.dbOnValue = onValue;
    window.dbSet = set;
    window.dbGet = get;
    window.dbUpdate = update;
    window.dbReady = true;

    loadArticles();
    initUserId();
</script>

<script>
    // ID de usuario único de 7 dígitos numéricos
    let currentUserId = null;
    function initUserId() {
        let stored = localStorage.getItem('waevo_user_id');
        if (!stored) {
            stored = Math.floor(1000000 + Math.random() * 9000000).toString();
            localStorage.setItem('waevo_user_id', stored);
        }
        currentUserId = stored;
        document.getElementById('user-id-badge').textContent = 'ID: ' + currentUserId;
    }

    let articles = [];
    let currentView = 'list';
    let currentTicketId = null;
    let isTicketAdmin = false;
    let tickets = [];
    let confirmStep = 0;

    function loadArticles() {
        const main = document.getElementById('main-content');
        main.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando artículos...</div>';

        const articlesRef = window.dbRef(window.db, 'articles');
        window.dbOnValue(articlesRef, (snapshot) => {
            const data = snapshot.val();
            articles = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
            articles.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            handleRouting();
        });
    }

    function handleRouting() {
        const path = window.location.pathname;
        const articleMatch = path.match(/^\/articles\/(.+)\/([a-zA-Z0-9]{6})$/);
        const ticketNewMatch = path.match(/^\/support\/waevo\/new$/);
        const ticketViewMatch = path.match(/^\/support\/waevo\/([a-zA-Z0-9]{6})$/);
        const myTicketsMatch = path.match(/^\/my-tickets$/);

        if (articleMatch) {
            const slug = articleMatch[1];
            const id = articleMatch[2];
            const article = articles.find(a => a.id === id && a.slug === slug);
            if (article) {
                renderArticle(article);
                currentView = 'article';
            } else {
                renderNotFound();
                currentView = 'notfound';
            }
        } else if (ticketNewMatch) {
            // Iniciar confirmaciones antes de mostrar formulario
            startTicketConfirmation();
        } else if (ticketViewMatch) {
            currentTicketId = ticketViewMatch[1];
            renderTicketChat(currentTicketId);
            currentView = 'ticketChat';
        } else if (myTicketsMatch) {
            renderMyTickets();
            currentView = 'myTickets';
        } else {
            renderList(articles);
            currentView = 'list';
        }
    }

    function renderList(arts) {
        const main = document.getElementById('main-content');
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const filtered = arts.filter(a => 
            a.title.toLowerCase().includes(searchTerm) || 
            a.description.toLowerCase().includes(searchTerm)
        );

        let html = `
            <div class="hero">
                <h1>Centro de Soporte</h1>
                <p>Encuentra respuestas a tus preguntas más frecuentes.</p>
            </div>
        `;

        if (arts.length === 0) {
            html += '<div class="loading">No hay artículos publicados aún.</div>';
        } else {
            html += `
                <div class="articles-grid">
                    ${filtered.map(a => `
                        <div class="article-card" onclick="navigateToArticle('${a.slug}', '${a.id}')">
                            ${a.image ? `<img src="${a.image}" alt="${a.title}" loading="lazy">` : ''}
                            <h2>${a.title}</h2>
                            <p>${a.description}</p>
                            <div class="article-meta">ID: ${a.id}</div>
                        </div>
                    `).join('')}
                </div>
                ${filtered.length === 0 ? '<div class="loading">No se encontraron artículos.</div>' : ''}
            `;
        }

        html += `
            <button class="ticket-btn" onclick="openTicketForm()">
                <i class="fas fa-ticket-alt"></i> Ticket
            </button>
            <button class="my-tickets-btn" onclick="openMyTickets()">
                <i class="fas fa-history"></i> Mis tickets
            </button>
        `;

        main.innerHTML = html;
    }

    function renderArticle(article) {
        const main = document.getElementById('main-content');
        document.title = `${article.title} - Waevo Articles`;
        main.innerHTML = `
            <div class="article-full">
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver al centro de soporte
                </div>
                ${article.image ? `<img src="${article.image}" alt="${article.title}">` : ''}
                <h1>${article.title}</h1>
                <div class="desc">${article.description}</div>
                <div class="article-meta">ID del artículo: ${article.id}</div>
            </div>
        `;
    }

    function renderNotFound() {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="hero">
                <h1>Artículo no encontrado</h1>
                <p>El artículo que buscas no existe o ha sido eliminado.</p>
                <a href="/" class="back-btn" onclick="navigateToList(); return false;">
                    <i class="fas fa-arrow-left"></i> Volver al centro de soporte
                </a>
            </div>
        `;
    }

    // --- TICKETS CON CONFIRMACIONES ---
    function openTicketForm() {
        confirmStep = 0;
        document.getElementById('confirmTicketModal').classList.add('active');
        updateConfirmStep();
    }

    function updateConfirmStep() {
        const titleEl = document.getElementById('confirmStepTitle');
        const textEl = document.getElementById('confirmStepText');
        const errorEl = document.getElementById('confirmError');
        errorEl.textContent = '';
        if (confirmStep === 0) {
            titleEl.textContent = 'Confirmación de uso responsable (1/3)';
            textEl.textContent = 'Este sistema de tickets es solo para soporte técnico. ¿Es realmente un problema con los servicios de Waevo?';
        } else if (confirmStep === 1) {
            titleEl.textContent = 'Confirmación de uso responsable (2/3)';
            textEl.textContent = 'Los tickets inapropiados, falsos o que no sean de soporte técnico pueden resultar en el baneo permanente de su cuenta. ¿Aún deseas continuar?';
        } else if (confirmStep === 2) {
            titleEl.textContent = 'Última confirmación (3/3)';
            textEl.textContent = 'Al enviar este ticket, aceptas que tu ID de usuario (' + currentUserId + ') quedará registrado. Cualquier uso indebido conllevará sanciones. ¿Crear ticket?';
        }
    }

    function nextConfirmStep() {
        confirmStep++;
        if (confirmStep >= 3) {
            document.getElementById('confirmTicketModal').classList.remove('active');
            window.history.pushState({}, '', '/support/waevo/new');
            renderTicketForm();
            currentView = 'ticketForm';
        } else {
            updateConfirmStep();
        }
    }

    function closeConfirmModal() {
        document.getElementById('confirmTicketModal').classList.remove('active');
        navigateToList();
    }

    function openMyTickets() {
        window.history.pushState({}, '', '/my-tickets');
        handleRouting();
    }

    function renderTicketForm() {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="modal" style="max-width:550px; margin:0 auto; box-shadow:var(--shadow-md);">
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver
                </div>
                <h3>Crear ticket de soporte</h3>
                <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:1rem;">Tu ID: <strong>${currentUserId}</strong></p>
                <input type="text" id="ticketTitle" placeholder="Título del ticket">
                <textarea id="ticketProblem" placeholder="Describe tu problema..."></textarea>
                <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Imagen (desde tu dispositivo):</label>
                <input type="file" id="ticketImageFile" accept="image/*" onchange="previewTicketImage()">
                <img id="ticketImagePreview" class="image-preview" style="display:none;">
                <input type="url" id="ticketImageUrl" placeholder="O pega URL de la imagen (opcional)">
                <div class="error-msg" id="ticketError"></div>
                <button onclick="createTicket()">Enviar ticket</button>
                <button class="secondary" onclick="navigateToList()">Cancelar</button>
            </div>
        `;
    }

    function previewTicketImage() {
        const file = document.getElementById('ticketImageFile').files[0];
        const preview = document.getElementById('ticketImagePreview');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    async function createTicket() {
        const title = document.getElementById('ticketTitle').value.trim();
        const problem = document.getElementById('ticketProblem').value.trim();
        const imageFile = document.getElementById('ticketImageFile').files[0];
        const imageUrl = document.getElementById('ticketImageUrl').value.trim();

        if (!title || !problem) {
            document.getElementById('ticketError').textContent = 'El título y la descripción son obligatorios.';
            return;
        }

        let finalImage = imageUrl || null;
        if (imageFile) {
            finalImage = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(imageFile);
            });
        }

        const ticketId = generateShortId();
        const ticketData = {
            id: ticketId,
            title,
            problem,
            image: finalImage,
            createdAt: Date.now(),
            status: 'open',
            userId: currentUserId
        };

        try {
            await window.dbSet(window.dbRef(window.db, `tickets/${ticketId}`), ticketData);
            saveTicketToLocal(ticketId);
            window.history.pushState({}, '', `/support/waevo/${ticketId}`);
            currentTicketId = ticketId;
            renderTicketChat(ticketId);
            currentView = 'ticketChat';
        } catch (error) {
            document.getElementById('ticketError').textContent = 'Error al crear ticket: ' + error.message;
        }
    }

    function saveTicketToLocal(ticketId) {
        const myTickets = JSON.parse(localStorage.getItem('myTickets') || '[]');
        if (!myTickets.includes(ticketId)) {
            myTickets.push(ticketId);
            localStorage.setItem('myTickets', JSON.stringify(myTickets));
        }
    }

    function getMyTicketsFromLocal() {
        return JSON.parse(localStorage.getItem('myTickets') || '[]');
    }

    async function renderMyTickets() {
        const main = document.getElementById('main-content');
        const localIds = getMyTicketsFromLocal();
        if (localIds.length === 0) {
            main.innerHTML = `
                <div class="back-btn" onclick="navigateToList()"><i class="fas fa-arrow-left"></i> Volver</div>
                <h3>Mis tickets</h3>
                <p>No has creado ningún ticket en este dispositivo.</p>
            `;
            return;
        }

        main.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando tickets...</div>';

        const ticketsRef = window.dbRef(window.db, 'tickets');
        const snapshot = await window.dbGet(ticketsRef);
        const allTickets = snapshot.val() || {};
        const myTickets = localIds
            .filter(id => allTickets[id])
            .map(id => ({ id, ...allTickets[id] }))
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        main.innerHTML = `
            <div class="back-btn" onclick="navigateToList()"><i class="fas fa-arrow-left"></i> Volver</div>
            <h3>Mis tickets</h3>
            ${myTickets.length === 0 ? '<p>No se encontraron tickets.</p>' : ''}
            ${myTickets.map(t => `
                <div class="ticket-list-item" onclick="openTicketFromList('${t.id}')">
                    <div class="info">
                        <strong>${t.title}</strong>
                        <p style="margin:0.3rem 0; color:var(--text-secondary);">${t.problem.substring(0, 100)}...</p>
                        <small>ID: ${t.id} | ${new Date(t.createdAt).toLocaleString()}</small>
                    </div>
                    <span class="status-badge ${t.status === 'open' ? 'status-open' : 'status-closed'}">${t.status === 'open' ? 'Abierto' : 'Cerrado'}</span>
                </div>
            `).join('')}
        `;
    }

    function openTicketFromList(ticketId) {
        window.history.pushState({}, '', `/support/waevo/${ticketId}`);
        currentTicketId = ticketId;
        renderTicketChat(ticketId);
        currentView = 'ticketChat';
    }

    function renderTicketChat(ticketId) {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="chat-container">
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver
                </div>
                <h3>Ticket: <span id="ticketTitleDisplay">Cargando...</span></h3>
                <div id="ticketStatusArea"></div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row" id="chatInputRow">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                    <button class="link-btn" onclick="attachLink()" title="Adjuntar enlace"><i class="fas fa-link"></i></button>
                    <button onclick="sendTicketMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        `;
        loadTicketData(ticketId);
        listenTicketMessages(ticketId);
    }

    function attachLink() {
        const url = prompt('Introduce el enlace:');
        if (url && url.trim()) {
            const input = document.getElementById('chatInput');
            input.value = input.value + ' ' + url.trim();
        }
    }

    function loadTicketData(ticketId) {
        const ticketRef = window.dbRef(window.db, `tickets/${ticketId}`);
        window.dbOnValue(ticketRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('ticketTitleDisplay').textContent = data.title;
                const statusArea = document.getElementById('ticketStatusArea');
                const chatInputRow = document.getElementById('chatInputRow');
                if (data.status === 'closed') {
                    statusArea.innerHTML = '<div class="closed-notice"><i class="fas fa-lock"></i> Este ticket ha sido cerrado. No se pueden enviar más mensajes.</div>';
                    if (chatInputRow) chatInputRow.style.display = 'none';
                } else {
                    statusArea.innerHTML = '';
                    if (chatInputRow) chatInputRow.style.display = 'flex';
                }
            }
        });
    }

    function listenTicketMessages(ticketId) {
        const messagesRef = window.dbRef(window.db, `tickets/${ticketId}/messages`);
        window.dbOnValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messages = data ? Object.values(data).sort((a, b) => a.timestamp - b.timestamp) : [];
            renderChatMessages(messages);
        });
    }

    function renderChatMessages(messages) {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        container.innerHTML = messages.map(m => {
            let content = m.text || '';
            // Convertir URLs en enlaces clickeables con estilo de barra azul
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            content = content.replace(urlRegex, (url) => {
                return `<a href="${url}" target="_blank" class="link-bar">${url}</a>`;
            });
            return `
                <div class="chat-msg ${m.sender === 'admin' ? 'admin' : 'user'}">
                    <div class="chat-sender">${m.senderName || (m.sender === 'admin' ? 'Asistente de Alex' : 'Ticket user')}</div>
                    <div>${content}</div>
                    ${m.image ? `<img src="${m.image}" alt="imagen">` : ''}
                    <div style="font-size:0.7rem; opacity:0.6; margin-top:0.3rem;">${new Date(m.timestamp).toLocaleString()}</div>
                </div>
            `;
        }).join('');
        container.scrollTop = container.scrollHeight;
    }

    async function sendTicketMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentTicketId) return;

        const ticketRef = window.dbRef(window.db, `tickets/${currentTicketId}`);
        const snap = await window.dbGet(ticketRef);
        if (snap.exists() && snap.val().status === 'closed') {
            alert('Este ticket está cerrado. No se pueden enviar mensajes.');
            return;
        }

        const sender = isTicketAdmin ? 'admin' : 'user';
        const senderName = isTicketAdmin ? 'Asistente de Alex' : 'Ticket user';

        const messagesRef = window.dbRef(window.db, `tickets/${currentTicketId}/messages`);
        await window.dbPush(messagesRef, {
            text,
            sender,
            senderName,
            timestamp: Date.now()
        });
        input.value = '';
    }

    // --- ADMIN DE TICKETS (botón tt) ---
    document.getElementById('ttTrigger').addEventListener('click', () => {
        document.getElementById('ttPasswordModal').classList.add('active');
        document.getElementById('ttPassword').value = '';
        document.getElementById('ttPasswordError').textContent = '';
    });

    function closeTTPasswordModal() {
        document.getElementById('ttPasswordModal').classList.remove('active');
    }

    function checkTTPassword() {
        const pw = document.getElementById('ttPassword').value;
        if (pw === 'waevoa') {
            isTicketAdmin = true;
            document.getElementById('ttPasswordModal').classList.remove('active');
            renderAdminTicketList();
            currentView = 'adminTickets';
        } else {
            document.getElementById('ttPasswordError').textContent = 'Contraseña incorrecta.';
        }
    }

    async function renderAdminTicketList() {
        const main = document.getElementById('main-content');
        main.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando tickets...</div>';

        const ticketsRef = window.dbRef(window.db, 'tickets');
        const snapshot = await window.dbGet(ticketsRef);
        const data = snapshot.val();
        tickets = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
        tickets.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        main.innerHTML = `
            <div class="back-btn" onclick="navigateToList()">
                <i class="fas fa-arrow-left"></i> Volver
            </div>
            <h3>Tickets de soporte (Admin)</h3>
            ${tickets.length === 0 ? '<p>No hay tickets.</p>' : ''}
            ${tickets.map(t => `
                <div class="ticket-list-item">
                    <div class="info" onclick="openAdminTicketChat('${t.id}')">
                        <strong>${t.title}</strong>
                        <p style="margin:0.3rem 0; color:var(--text-secondary);">${t.problem.substring(0, 100)}...</p>
                        <small>ID: ${t.id} | Usuario: ${t.userId || '---'} | ${new Date(t.createdAt).toLocaleString()}</small>
                    </div>
                    <span class="status-badge ${t.status === 'open' ? 'status-open' : 'status-closed'}">${t.status === 'open' ? 'Abierto' : 'Cerrado'}</span>
                    ${t.status === 'open' ? `<button class="close-ticket-btn" onclick="event.stopPropagation(); closeTicket('${t.id}')">Cerrar</button>` : ''}
                    ${t.userId ? `<button class="ban-user-btn" onclick="event.stopPropagation(); banUser('${t.userId}')">Banear</button>` : ''}
                </div>
            `).join('')}
        `;
    }

    async function closeTicket(ticketId) {
        if (!confirm('¿Estás seguro de que quieres cerrar este ticket?')) return;
        try {
            await window.dbUpdate(window.dbRef(window.db, `tickets/${ticketId}`), { status: 'closed' });
            renderAdminTicketList();
        } catch (error) {
            alert('Error al cerrar ticket: ' + error.message);
        }
    }

    async function banUser(userId) {
        if (!confirm(`¿Estás seguro de que quieres banear al usuario ${userId}? Será baneado permanentemente de todos los servicios Waevo.`)) return;
        try {
            await window.dbSet(window.dbRef(window.db, `bans/${userId}`), {
                expiresAt: 9999999999999,
                bannedBy: 'admin',
                alias: 'Soporte Waevo'
            });
            alert('Usuario baneado exitosamente.');
        } catch (error) {
            alert('Error al banear: ' + error.message);
        }
    }

    function openAdminTicketChat(ticketId) {
        currentTicketId = ticketId;
        renderAdminTicketChat(ticketId);
        currentView = 'adminTicketChat';
    }

    function renderAdminTicketChat(ticketId) {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="chat-container">
                <div class="back-btn" onclick="renderAdminTicketList()">
                    <i class="fas fa-arrow-left"></i> Volver a lista
                </div>
                <h3>Ticket: <span id="ticketTitleDisplay">Cargando...</span></h3>
                <div id="ticketStatusArea"></div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row" id="chatInputRow">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                    <button class="link-btn" onclick="attachLink()" title="Adjuntar enlace"><i class="fas fa-link"></i></button>
                    <button onclick="sendTicketMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div style="margin-top:1rem; display:flex; gap:0.5rem;" id="adminActions"></div>
            </div>
        `;
        loadTicketData(ticketId);
        listenTicketMessages(ticketId);
        const ticketRef = window.dbRef(window.db, `tickets/${ticketId}`);
        window.dbGet(ticketRef).then(snap => {
            if (snap.exists() && snap.val().status === 'open') {
                document.getElementById('adminActions').innerHTML = `
                    <button class="close-ticket-btn" onclick="closeTicket('${ticketId}')">Cerrar ticket</button>
                `;
            }
        });
    }

    // --- Funciones comunes ---
    function navigateToArticle(slug, id) {
        const url = `/articles/${slug}/${id}`;
        window.history.pushState({}, '', url);
        handleRouting();
    }

    function navigateToList() {
        isTicketAdmin = false;
        window.history.pushState({}, '', '/');
        document.title = 'Waevo Articles - Centro de Soporte';
        handleRouting();
    }

    function filterArticles() {
        if (currentView === 'list') {
            renderList(articles);
        }
    }

    window.addEventListener('popstate', () => {
        handleRouting();
    });

    // --- Admin artículos (botón +) ---
    document.getElementById('adminTrigger').addEventListener('click', () => {
        document.getElementById('passwordModal').classList.add('active');
        document.getElementById('adminPassword').value = '';
        document.getElementById('passwordError').textContent = '';
    });

    function closePasswordModal() {
        document.getElementById('passwordModal').classList.remove('active');
    }

    function checkAdminPassword() {
        const pw = document.getElementById('adminPassword').value;
        if (pw === 'waevoa') {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('articleModal').classList.add('active');
            document.getElementById('articleTitle').value = '';
            document.getElementById('articleDesc').value = '';
            document.getElementById('articleImage').value = '';
            document.getElementById('articleError').textContent = '';
        } else {
            document.getElementById('passwordError').textContent = 'Contraseña incorrecta.';
        }
    }

    function closeArticleModal() {
        document.getElementById('articleModal').classList.remove('active');
    }

    async function createArticle() {
        const title = document.getElementById('articleTitle').value.trim();
        const description = document.getElementById('articleDesc').value.trim();
        const image = document.getElementById('articleImage').value.trim();

        if (!title || !description) {
            document.getElementById('articleError').textContent = 'El título y la descripción son obligatorios.';
            return;
        }

        const id = generateShortId();
        const slug = title.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').substring(0, 60);

        const articleData = {
            title,
            description,
            image: image || null,
            id,
            slug,
            createdAt: Date.now()
        };

        try {
            await window.dbSet(window.dbRef(window.db, `articles/${id}`), articleData);
            document.getElementById('articleModal').classList.remove('active');
            navigateToArticle(slug, id);
        } catch (error) {
            document.getElementById('articleError').textContent = 'Error al publicar: ' + error.message;
        }
    }

    function generateShortId() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 6; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // Cerrar modales al hacer clic fuera
    document.getElementById('passwordModal').addEventListener('click', function(e) {
        if (e.target === this) closePasswordModal();
    });
    document.getElementById('articleModal').addEventListener('click', function(e) {
        if (e.target === this) closeArticleModal();
    });
    document.getElementById('ttPasswordModal').addEventListener('click', function(e) {
        if (e.target === this) closeTTPasswordModal();
    });
    document.getElementById('confirmTicketModal').addEventListener('click', function(e) {
        if (e.target === this) closeConfirmModal();
    });
</script>
