<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waevo Articles - Centro de Soporte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo i { font-size: 1.8rem; }
        .search-bar {
            flex: 1;
            max-width: 400px;
            margin: 0 2rem;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            font-size: 0.95rem;
            background: var(--bg);
            transition: all 0.2s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .search-bar i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Main */
        .main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
        }
        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }
        .article-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .article-card h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .article-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-bottom: 0.75rem;
        }
        .article-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        /* Article view */
        .article-full {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
        }
        .article-full img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 1rem 0;
        }
        .article-full h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .article-full .desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        /* Botón "+" oculto y botón "tt" */
        .admin-trigger {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.25;
            transition: all 0.3s;
            z-index: 200;
        }
        .admin-trigger:hover {
            opacity: 1;
            color: var(--primary);
            border-color: var(--primary);
        }
        .tt-trigger {
            bottom: 5rem;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Botón Ticket */
        .ticket-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 2rem auto;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }
        .ticket-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        .modal input, .modal textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
            font-family: inherit;
        }
        .modal textarea { min-height: 100px; resize: vertical; }
        .modal button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        .modal button.secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-bottom: 0.5rem; }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        /* Estilos del chat */
        .chat-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: var(--shadow);
        }
        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .chat-msg {
            max-width: 75%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .chat-msg.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 0;
        }
        .chat-msg.admin {
            align-self: flex-start;
            background: #f1f5f9;
            border-bottom-left-radius: 0;
        }
        .chat-msg img {
            max-width: 200px;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
        .chat-sender {
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
        }
        .chat-input-row {
            display: flex;
            gap: 0.5rem;
        }
        .chat-input-row input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            font-size: 0.95rem;
        }
        .chat-input-row button {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
        }

        .ticket-list-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ticket-list-item:hover { box-shadow: var(--shadow-md); }
    </style>
</head>
<body>

<header class="header">
    <div class="header-content">
        <a href="/" class="logo">
            <i class="fas fa-book-open"></i> Waevo Articles
        </a>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar artículos..." oninput="filterArticles()">
        </div>
    </div>
</header>

<main class="main" id="main-content">
    <!-- Contenido dinámico -->
</main>

<!-- Botones flotantes -->
<div class="admin-trigger" id="adminTrigger" title="Crear artículo">+</div>
<div class="admin-trigger tt-trigger" id="ttTrigger" title="Tickets admin">tt</div>

<!-- Modal de contraseña para artículos -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal">
        <h3>Acceso de administrador</h3>
        <input type="password" id="adminPassword" placeholder="Contraseña">
        <div class="error-msg" id="passwordError"></div>
        <button onclick="checkAdminPassword()">Acceder</button>
        <button class="secondary" onclick="closePasswordModal()">Cancelar</button>
    </div>
</div>

<!-- Modal de creación de artículo -->
<div class="modal-overlay" id="articleModal">
    <div class="modal">
        <h3>Crear nuevo artículo</h3>
        <input type="text" id="articleTitle" placeholder="Título del artículo">
        <textarea id="articleDesc" placeholder="Descripción / Contenido"></textarea>
        <input type="url" id="articleImage" placeholder="URL de la imagen (opcional)">
        <div class="error-msg" id="articleError"></div>
        <button onclick="createArticle()">Publicar artículo</button>
        <button class="secondary" onclick="closeArticleModal()">Cancelar</button>
    </div>
</div>

<!-- Modal de contraseña para tickets admin -->
<div class="modal-overlay" id="ttPasswordModal">
    <div class="modal">
        <h3>Acceso a tickets</h3>
        <input type="password" id="ttPassword" placeholder="Contraseña">
        <div class="error-msg" id="ttPasswordError"></div>
        <button onclick="checkTTPassword()">Acceder</button>
        <button class="secondary" onclick="closeTTPasswordModal()">Cancelar</button>
    </div>
</div>

<!-- Firebase SDK -->

    import { getDatabase, ref, push, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        messagingSenderId: "313414356056",

        measurementId: "G-8T4CPC1BQ3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbPush = push;

<script>
    let articles = [];
    let currentView = 'list'; // list | article | ticketForm | ticketChat | adminTickets | adminTicketChat | notfound
    let currentTicketId = null;
    let isTicketAdmin = false;
    let tickets = [];

    // Cargar artículos desde Firebase
    function loadArticles() {
        const main = document.getElementById('main-content');
        main.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando artículos...</div>';

        const articlesRef = window.dbRef(window.db, 'articles');
        window.dbOnValue(articlesRef, (snapshot) => {
            const data = snapshot.val();
            articles = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
            articles.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            handleRouting();
        });
    }

    // Enrutamiento SPA
    function handleRouting() {
        const path = window.location.pathname;
        const articleMatch = path.match(/^\/articles\/(.+)\/([a-zA-Z0-9]{6})$/);
        const ticketNewMatch = path.match(/^\/support\/waevo\/new$/);
        const ticketViewMatch = path.match(/^\/support\/waevo\/([a-zA-Z0-9]{6})$/);

        if (articleMatch) {
            const slug = articleMatch[1];
            const id = articleMatch[2];
            const article = articles.find(a => a.id === id && a.slug === slug);
            if (article) {
                renderArticle(article);
                currentView = 'article';
            } else {
                renderNotFound();
                currentView = 'notfound';
            }
        } else if (ticketNewMatch) {
            renderTicketForm();
            currentView = 'ticketForm';
        } else if (ticketViewMatch) {
            const ticketId = ticketViewMatch[1];
            currentTicketId = ticketId;
            renderTicketChat(ticketId);
            currentView = 'ticketChat';
        } else {
            renderList(articles);
            currentView = 'list';
        }
    }

    // Renderizar lista de artículos con botón Ticket
    function renderList(arts) {
        const main = document.getElementById('main-content');
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const filtered = arts.filter(a => 
            a.title.toLowerCase().includes(searchTerm) || 
            a.description.toLowerCase().includes(searchTerm)
        );

        let html = `
            <div class="hero">
                <h1>Centro de Soporte</h1>
                <p>Encuentra respuestas a tus preguntas más frecuentes.</p>
            </div>
        `;

        if (arts.length === 0) {
            html += '<div class="loading">No hay artículos publicados aún.</div>';
        } else {
            html += `
                <div class="articles-grid">
                    ${filtered.map(a => `
                        <div class="article-card" onclick="navigateToArticle('${a.slug}', '${a.id}')">
                            ${a.image ? `<img src="${a.image}" alt="${a.title}" loading="lazy">` : ''}
                            <h2>${a.title}</h2>
                            <p>${a.description}</p>
                            <div class="article-meta">ID: ${a.id}</div>
                        </div>
                    `).join('')}
                </div>
                ${filtered.length === 0 ? '<div class="loading">No se encontraron artículos.</div>' : ''}
            `;
        }

        // Botón Ticket grande
        html += `
            <button class="ticket-btn" onclick="openTicketForm()">
                <i class="fas fa-ticket-alt"></i> Ticket
            </button>
        `;

        main.innerHTML = html;
    }

    // Renderizar artículo completo
    function renderArticle(article) {
        const main = document.getElementById('main-content');
        document.title = `${article.title} - Waevo Articles`;
        main.innerHTML = `
            <div class="article-full">
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver al centro de soporte
                </div>
                ${article.image ? `<img src="${article.image}" alt="${article.title}">` : ''}
                <h1>${article.title}</h1>
                <div class="desc">${article.description}</div>
                <div class="article-meta">ID del artículo: ${article.id}</div>
            </div>
        `;
    }

    function renderNotFound() {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="hero">
                <h1>Artículo no encontrado</h1>
                <p>El artículo que buscas no existe o ha sido eliminado.</p>
                <a href="/" class="back-btn" onclick="navigateToList(); return false;">
                    <i class="fas fa-arrow-left"></i> Volver al centro de soporte
                </a>
            </div>
        `;
    }

    // --- TICKETS ---
    function openTicketForm() {
        window.history.pushState({}, '', '/support/waevo/new');
        handleRouting();
    }

    function renderTicketForm() {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="modal" style="max-width:500px; margin:0 auto; box-shadow:var(--shadow-md);">
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver
                </div>
                <h3>Crear ticket de soporte</h3>
                <input type="text" id="ticketTitle" placeholder="Título del ticket">
                <textarea id="ticketProblem" placeholder="Describe tu problema..."></textarea>
                <input type="url" id="ticketImage" placeholder="URL de la imagen (opcional)">
                <div class="error-msg" id="ticketError"></div>
                <button onclick="createTicket()">Enviar ticket</button>
                <button class="secondary" onclick="navigateToList()">Cancelar</button>
            </div>
        `;
    }

    async function createTicket() {
        const title = document.getElementById('ticketTitle').value.trim();
        const problem = document.getElementById('ticketProblem').value.trim();
        const image = document.getElementById('ticketImage').value.trim();

        if (!title || !problem) {
            document.getElementById('ticketError').textContent = 'El título y la descripción son obligatorios.';
            return;
        }

        const ticketId = generateShortId();
        const ticketData = {
            id: ticketId,
            title,
            problem,
            image: image || null,
            createdAt: Date.now(),
            status: 'open'
        };

        try {
            await window.dbSet(window.dbRef(window.db, `tickets/${ticketId}`), ticketData);
            // Redirigir al chat del ticket
            window.history.pushState({}, '', `/support/waevo/${ticketId}`);
            currentTicketId = ticketId;
            renderTicketChat(ticketId);
            currentView = 'ticketChat';
        } catch (error) {
            document.getElementById('ticketError').textContent = 'Error al crear ticket: ' + error.message;
        }
    }

    function renderTicketChat(ticketId) {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="chat-container">
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver
                </div>
                <h3>Ticket: <span id="ticketTitleDisplay">Cargando...</span></h3>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                    <button onclick="sendTicketMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        `;
        loadTicketData(ticketId);
        listenTicketMessages(ticketId);
    }

    function loadTicketData(ticketId) {
        const ticketRef = window.dbRef(window.db, `tickets/${ticketId}`);
        window.dbOnValue(ticketRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('ticketTitleDisplay').textContent = data.title;
            }
        });
    }

    function listenTicketMessages(ticketId) {
        const messagesRef = window.dbRef(window.db, `tickets/${ticketId}/messages`);
        window.dbOnValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messages = data ? Object.values(data).sort((a, b) => a.timestamp - b.timestamp) : [];
            renderChatMessages(messages);
        });
    }

    function renderChatMessages(messages) {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        container.innerHTML = messages.map(m => `
            <div class="chat-msg ${m.sender === 'admin' ? 'admin' : 'user'}">
                <div class="chat-sender">${m.senderName || (m.sender === 'admin' ? 'Asistente de Alex' : 'Ticket user')}</div>
                <div>${m.text}</div>
                ${m.image ? `<img src="${m.image}" alt="imagen">` : ''}
                <div style="font-size:0.7rem; opacity:0.6; margin-top:0.3rem;">${new Date(m.timestamp).toLocaleString()}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    async function sendTicketMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentTicketId) return;

        const sender = isTicketAdmin ? 'admin' : 'user';
        const senderName = isTicketAdmin ? 'Asistente de Alex' : 'Ticket user';

        const messagesRef = window.dbRef(window.db, `tickets/${currentTicketId}/messages`);
        await window.dbPush(messagesRef, {
            text,
            sender,
            senderName,
            timestamp: Date.now()
        });
        input.value = '';
    }

    // --- ADMIN DE TICKETS (botón tt) ---
    document.getElementById('ttTrigger').addEventListener('click', () => {
        document.getElementById('ttPasswordModal').classList.add('active');
        document.getElementById('ttPassword').value = '';
        document.getElementById('ttPasswordError').textContent = '';
    });

    function closeTTPasswordModal() {
        document.getElementById('ttPasswordModal').classList.remove('active');
    }

    function checkTTPassword() {
        const pw = document.getElementById('ttPassword').value;
        if (pw === 'waevoa') {
            isTicketAdmin = true;
            document.getElementById('ttPasswordModal').classList.remove('active');
            renderAdminTicketList();
            currentView = 'adminTickets';
        } else {
            document.getElementById('ttPasswordError').textContent = 'Contraseña incorrecta.';
        }
    }

    async function renderAdminTicketList() {
        const main = document.getElementById('main-content');
        main.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando tickets...</div>';

        const ticketsRef = window.dbRef(window.db, 'tickets');
        window.dbGet(ticketsRef).then(snapshot => {
            const data = snapshot.val();
            tickets = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
            tickets.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            main.innerHTML = `
                <div class="back-btn" onclick="navigateToList()">
                    <i class="fas fa-arrow-left"></i> Volver
                </div>
                <h3>Tickets de soporte (Admin)</h3>
                ${tickets.length === 0 ? '<p>No hay tickets.</p>' : ''}
                ${tickets.map(t => `
                    <div class="ticket-list-item" onclick="openAdminTicketChat('${t.id}')">
                        <strong>${t.title}</strong>
                        <p style="margin:0.3rem 0; color:var(--text-secondary);">${t.problem.substring(0, 100)}...</p>
                        <small>ID: ${t.id} | ${new Date(t.createdAt).toLocaleString()}</small>
                    </div>
                `).join('')}
            `;
        });
    }

    function openAdminTicketChat(ticketId) {
        currentTicketId = ticketId;
        renderAdminTicketChat(ticketId);
        currentView = 'adminTicketChat';
    }

    function renderAdminTicketChat(ticketId) {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="chat-container">
                <div class="back-btn" onclick="renderAdminTicketList()">
                    <i class="fas fa-arrow-left"></i> Volver a lista
                </div>
                <h3>Ticket: <span id="ticketTitleDisplay">Cargando...</span></h3>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                    <button onclick="sendTicketMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        `;
        loadTicketData(ticketId);
        listenTicketMessages(ticketId);
    }

    // --- Funciones comunes ---
    function navigateToArticle(slug, id) {
        const url = `/articles/${slug}/${id}`;
        window.history.pushState({}, '', url);
        handleRouting();
    }

    function navigateToList() {
        isTicketAdmin = false;
        window.history.pushState({}, '', '/');
        document.title = 'Waevo Articles - Centro de Soporte';
        handleRouting();
    }

    function filterArticles() {
        if (currentView === 'list') {
            renderList(articles);
        }
    }

    window.addEventListener('popstate', () => {
        handleRouting();
    });

    // --- Admin artículos (botón +) ---
    document.getElementById('adminTrigger').addEventListener('click', () => {
        document.getElementById('passwordModal').classList.add('active');
        document.getElementById('adminPassword').value = '';
        document.getElementById('passwordError').textContent = '';
    });

    function closePasswordModal() {
        document.getElementById('passwordModal').classList.remove('active');
    }

    function checkAdminPassword() {
        const pw = document.getElementById('adminPassword').value;
        if (pw === 'waevoa') {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('articleModal').classList.add('active');
            document.getElementById('articleTitle').value = '';
            document.getElementById('articleDesc').value = '';
            document.getElementById('articleImage').value = '';
            document.getElementById('articleError').textContent = '';
        } else {
            document.getElementById('passwordError').textContent = 'Contraseña incorrecta.';
        }
    }

    function closeArticleModal() {
        document.getElementById('articleModal').classList.remove('active');
    }

    async function createArticle() {
        const title = document.getElementById('articleTitle').value.trim();
        const description = document.getElementById('articleDesc').value.trim();
        const image = document.getElementById('articleImage').value.trim();

        if (!title || !description) {
            document.getElementById('articleError').textContent = 'El título y la descripción son obligatorios.';
            return;
        }

        const id = generateShortId();
        const slug = title.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').substring(0, 60);

        const articleData = {
            title,
            description,
            image: image || null,
            id,
            slug,
            createdAt: Date.now()
        };

        try {
            await window.dbSet(window.dbRef(window.db, `articles/${id}`), articleData);
            document.getElementById('articleModal').classList.remove('active');
            navigateToArticle(slug, id);
        } catch (error) {
            document.getElementById('articleError').textContent = 'Error al publicar: ' + error.message;
        }
    }

    function generateShortId() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 6; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // Cerrar modales al hacer clic fuera
    document.getElementById('passwordModal').addEventListener('click', function(e) {
        if (e.target === this) closePasswordModal();
    });
    document.getElementById('articleModal').addEventListener('click', function(e) {
        if (e.target === this) closeArticleModal();
    });
    document.getElementById('ttPasswordModal').addEventListener('click', function(e) {
        if (e.target === this) closeTTPasswordModal();
    });
</script>

</body>
</html>
